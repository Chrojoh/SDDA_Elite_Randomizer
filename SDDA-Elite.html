<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/elite-192.png">
<title>SDDA Elite</title>
<style>
  body { margin: 0; background: white; color: #171717; font: 1.25rem/1.2 system-ui, sans-serif; }
  main {
    box-sizing: border-box;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 42rem;
    margin: auto;
    padding: .75rem 1rem 1rem;
    display: flex;
    flex-direction: column;
  }
  h1 { margin: 0 0 .625rem; font-size: 2.375rem; line-height: 1.1; text-align: center; }
  button { width: 100%; min-height: 44px; font: inherit; cursor: pointer; background: #6b21a8; color: white; border: 0; border-radius: 4px; }
  button:active { background: #581c87; }
  #results { display: flex; flex: 1; flex-direction: column; gap: .5rem; margin-top: .5rem; }
  section {
    display: flex;
    flex: 1 0 auto;
    flex-direction: column;
    border: 1px solid #bdbdbd;
    border-radius: 4px;
    padding: .625rem .75rem;
  }
  h2 { margin: 0 0 .375rem; font-size: 1.5rem; text-align: center; }
  dl { display: grid; flex: 1; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; margin: 0; }
  dt { font-size: 1.125rem; font-weight: bold; }
  dd { margin: .2rem 0 0; }
  .hide-field { display: grid; grid-template-rows: auto 1fr; }
  .hides { display: grid; grid-auto-rows: 1fr; font-size: 1.25rem; }
  .hides div { display: grid; align-items: center; }
  .hides span { grid-area: 1 / 1; overflow-wrap: anywhere; }
  .row-sizer { visibility: hidden; }
  .distractor-field { display: grid; grid-template-rows: auto 1fr; justify-self: end; width: fit-content; max-width: 100%; text-align: center; }
  .distractor-field dt { text-align: right; }
  .distractors { display: grid; place-items: center; margin: 0; font-size: 1.75rem; font-weight: bold; }
</style>
<main>
  <h1>SDDA Elite</h1>
  <button type="button" id="randomize">Randomize</button>
  <div id="results" aria-live="polite"></div>
  <noscript>This randomizer needs JavaScript enabled in your browser.</noscript>
</main>
<template id="area">
  <section>
    <h2></h2>
    <dl>
      <div class="hide-field"><dt>Hides <span class="hide-count"></span></dt><dd class="hides"></dd></div>
      <div class="distractor-field"><dt>Distractors</dt><dd class="distractors"></dd></div>
    </dl>
  </section>
</template>
<script>
  const areas = [
    { title: "Containers", min: 2, max: 4 },
    { title: "Interior", min: 0, max: 5 },
    { title: "Exterior", min: 0, max: 3 },
  ];
  const singleHidePuzzles = [
    "Elevation", "Threshold", "High-low", "Deep accessible", "Inaccessible",
  ];

  function randomInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  function roll({ min, max }) {
    const count = randomInt(min, max);
    const distractors = randomInt(1, 3);
    const eligible = [...singleHidePuzzles];
    if (count >= 2) eligible.push("Mirrored hides", "Converging");

    const puzzles = [];
    for (let i = 0; i < count; i++) {
      const index = randomInt(0, eligible.length - 1);
      puzzles.push(eligible.splice(index, 1)[0]);
    }
    return { puzzles, distractors };
  }

  const results = document.getElementById("results");
  const template = document.getElementById("area");
  for (const area of areas) {
    const box = template.content.cloneNode(true);
    box.querySelector("h2").textContent = area.title;
    area.hideCount = box.querySelector(".hide-count");
    area.hides = box.querySelector(".hides");
    area.distractors = box.querySelector(".distractors");
    results.append(box);
  }

  function rollAll() {
    for (const area of areas) {
      const { puzzles, distractors } = roll(area);
      area.hideCount.textContent = puzzles.length;
      const lines = puzzles.length ? puzzles : ["BLANK"];
      area.hides.replaceChildren(...Array.from({ length: area.max }, (_, index) => {
        const line = document.createElement("div");
        const sizingText = document.createElement("span");
        sizingText.className = "row-sizer";
        sizingText.setAttribute("aria-hidden", "true");
        sizingText.textContent = "Deep accessible";
        const resultText = document.createElement("span");
        resultText.textContent = lines[index] ?? "";
        line.append(sizingText, resultText);
        return line;
      }));
      area.distractors.textContent = distractors;
    }
  }

  document.getElementById("randomize").addEventListener("click", rollAll);
  rollAll();

  if (location.protocol !== "file:" && "serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(error => {
      console.warn("Offline setup failed.", error);
    });
  }
</script>
</html>
